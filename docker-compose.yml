version: '3.9'

services:
  wireguard:
    build:
      context: .
      dockerfile: Dockerfile.wireguard
    container_name: wireguard
    restart: unless-stopped
    privileged: true  # Required for WireGuard to create network interfaces
    cap_add:
      - NET_ADMIN      # Required for network interface management
      - SYS_MODULE     # Required for kernel module operations
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.forwarding=1
      - net.ipv6.conf.all.forwarding=1
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - /lib/modules:/lib/modules
    ports:
      # WireGuard VPN port (UDP) - direct, never goes through Coolify's proxy
      - "51820:51820/udp"
      # API port (exposed through WireGuard container's network).
      # HTTP(S) traffic to vpn.blackie-networks.com is handled separately by
      # Coolify's Traefik proxy (set the domain on this service in the Coolify
      # dashboard) - this host mapping just keeps direct IP:5020 access working.
      # Moved off 5000 - already bound by another app on this shared host.
      - "${API_PORT:-5020}:5020/tcp"
      # Per-router Winbox/SSH/API proxy ports (see utils/port-allocator.js -
      # PORT_RANGES: winbox 20000-20099, ssh 20100-20199, api 20200-20299).
      # These are raw TCP (not HTTP), so they can't be routed by Coolify's
      # Traefik proxy via the domain/hostname - each router needs its own real
      # listening port. Publishing the whole range up front means
      # tcp-proxy-service.js can dynamically start/stop listeners on any port
      # in it, per router, without ever needing a docker-compose/Coolify
      # redeploy. Kept small and moved into the 20000s (rather than the
      # commonly-used 1000-9999 block) to avoid colliding with other apps'
      # ports on this shared host.
      - "20000-20299:20000-20299/tcp"
      # Existing router "ChukaMikrotik" was already provisioned under the old
      # 1000-9999 range before the move above - published individually here
      # (rather than reopening the whole old range) so it stays reachable.
      # TODO: reprovision/migrate it into the 20000-20299 range and drop these.
      - "1000:1000/tcp"
      - "3334:3334/tcp"
      - "6667:6667/tcp"
    env_file:
      - .env  # Loads WIREGUARD_PRIVATE_KEY
    environment:
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - TZ=${TZ:-UTC}
    labels:
      # Tell Coolify to use this container
      - "coolify.managed=true"
      - "coolify.name=wireguard-vpn"
      - "coolify.http.port=5020"
    healthcheck:
      test: ["CMD-SHELL", "wg show wg0 > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - wireguard-net
      - coolify-resource-net

  wireguard-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: wireguard-api
    restart: unless-stopped
    network_mode: "service:wireguard"  # Share WireGuard container's network namespace
    cap_add:
      - NET_ADMIN  # Required to run 'wg set' commands to modify WireGuard interface
    depends_on:
      - wireguard
    environment:
      # MongoDB connection string (REQUIRED - use external MongoDB or set MONGO_URI)
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/wireguard}
      # Server endpoint for client configs
      - SERVER_ENDPOINT=${SERVER_ENDPOINT:-YOUR_SERVER_IP:51820}
      # Node environment
      - NODE_ENV=${NODE_ENV:-production}
      # API port (internal, shared with WireGuard container)
      - PORT=5020
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5020/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  wireguard-net:
    driver: bridge
  # Coolify auto-creates a network named after the resource UUID and attaches
  # its Traefik proxy (coolify-proxy) to it so it can route to this app's
  # containers. Our custom wireguard-net above isn't enough on its own -
  # without also joining this network, Traefik has a route configured but no
  # path to the container, which surfaces as a 502 Bad Gateway.
  coolify-resource-net:
    external: true
    name: ${COOLIFY_RESOURCE_UUID}
