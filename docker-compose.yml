version: '3.9'

services:
  wireguard:
    build:
      context: .
      dockerfile: Dockerfile.wireguard
    container_name: wireguard
    restart: unless-stopped
    privileged: true  # Required for WireGuard to create network interfaces
    cap_add:
      - NET_ADMIN      # Required for network interface management
      - SYS_MODULE     # Required for kernel module operations
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.forwarding=1
      - net.ipv6.conf.all.forwarding=1
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - /lib/modules:/lib/modules
    ports:
      # WireGuard VPN port (UDP) - direct, never goes through Coolify's proxy
      - "51820:51820/udp"
      # API port (exposed through WireGuard container's network).
      # HTTP(S) traffic to vpn.blackie-networks.com is handled separately by
      # Coolify's Traefik proxy (set the domain on this service in the Coolify
      # dashboard) - this host mapping just keeps direct IP:5020 access working.
      # Moved off 5000 - already bound by another app on this shared host.
      - "${API_PORT:-5020}:5020/tcp"
      # Per-router Winbox/SSH/API proxy ports. The active range is now
      # admin-configurable (Settings.proxyPortRangeStart/End, default
      # 6100-6899 - 800 ports, split into three equal thirds by
      # utils/port-allocator.js:getPortRanges) rather than hardcoded - but
      # that setting only controls which ports *new* routers get allocated
      # from. Docker still has to actually publish whatever ports are in use,
      # so this list must be kept in sync by hand whenever the admin changes
      # the range, and old ranges must stay published until every router
      # provisioned under them is migrated off. These are raw TCP (not
      # HTTP), so they can't be routed by Coolify's Traefik proxy via the
      # domain/hostname - each router needs its own real listening port.
      # Deliberately capped at 800 ports (not the previous 1900) - each
      # published port costs a docker-proxy process per IP family, and a
      # large range measurably slows every container start/stop (~4400
      # docker-proxy processes observed with the old 6100-7999 + 20000-20299
      # ranges combined).
      - "6100-6899:6100-6899/tcp"
      # 20000-20299 (legacy range) and the individually-published legacy
      # single ports for "ChukaMikrotik" have been dropped as of the move to
      # the new 172.20.0.0/24 environment - old routers provisioned under
      # them (e.g. "Mikrotikproxy") are being re-provisioned fresh instead
      # of migrated, per that cutover.
    env_file:
      - .env  # Loads WIREGUARD_PRIVATE_KEY
    environment:
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      # This deployment's VPN interface address/subnet. Must be unique across
      # deployments that might ever share a client router - reusing another
      # deployment's subnet (or its WIREGUARD_PRIVATE_KEY) causes routers
      # holding tunnels to both to silently misroute or fail to reply.
      - WG_SERVER_ADDRESS=${WG_SERVER_ADDRESS:-10.0.0.1/24}
      - TZ=${TZ:-UTC}
    labels:
      # Tell Coolify to use this container
      - "coolify.managed=true"
      - "coolify.name=wireguard-vpn"
      - "coolify.http.port=5020"
    healthcheck:
      test: ["CMD-SHELL", "wg show wg0 > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - wireguard-net
      - coolify-resource-net

  wireguard-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: wireguard-api
    restart: unless-stopped
    network_mode: "service:wireguard"  # Share WireGuard container's network namespace
    cap_add:
      - NET_ADMIN  # Required to run 'wg set' commands to modify WireGuard interface
    depends_on:
      - wireguard
    environment:
      # MongoDB connection string (REQUIRED - use external MongoDB or set MONGO_URI)
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/wireguard}
      # Server endpoint for client configs
      - SERVER_ENDPOINT=${SERVER_ENDPOINT:-YOUR_SERVER_IP:51820}
      # Node environment
      - NODE_ENV=${NODE_ENV:-production}
      # API port (internal, shared with WireGuard container)
      - PORT=5020
      # First 3 octets of this deployment's VPN subnet (e.g. "10.0.0" for
      # 10.0.0.0/24). Must match the wireguard service's WG_SERVER_ADDRESS
      # above. Overridable per-deployment via Settings.vpnSubnetPrefix in the
      # admin panel too - see models/Settings.js.
      - VPN_SUBNET_PREFIX=${VPN_SUBNET_PREFIX:-10.0.0}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5020/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  wireguard-net:
    driver: bridge
  # Coolify auto-creates a network named after the resource UUID and attaches
  # its Traefik proxy (coolify-proxy) to it so it can route to this app's
  # containers. Our custom wireguard-net above isn't enough on its own -
  # without also joining this network, Traefik has a route configured but no
  # path to the container, which surfaces as a 502 Bad Gateway.
  coolify-resource-net:
    external: true
    name: ${COOLIFY_RESOURCE_UUID}
